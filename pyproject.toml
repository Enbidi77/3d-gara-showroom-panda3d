[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panda-motors"
version = "1.0.0"
description = "Panda Motors — Interactive 3D Luxury Car Showroom using Python and Panda3D"
authors = [
    {name = "Panda Motors Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "panda3d>=1.10.14",
    "panda3d-gltf>=1.3.0",
    "panda3d-simplepbr>=0.13.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
panda-motors = "panda_motors.main:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

