[app]
name = "Panda Motors"
tagline = "Explore. Discover. Drive."
version = "1.0.0"
window_title = "Panda Motors — Interactive 3D Luxury Car Showroom"
default_zone = "main_showroom"
start_in_menu = true
debug_mode = false

[audio]
master_volume = 0.8
ambient_volume = 0.6
sfx_volume = 0.7
music_enabled = true
sfx_enabled = true

[ui]
theme = "dark" # "dark" or "light"
hud_visible = true
minimap_visible = true
font_size = "medium"
language = "en"

